# Goose 配置模板
# 用法:cp configs/goose.example.yaml configs/goose.yaml 然后填真实路径
#
# 注意:goose.yaml 已在 .gitignore 里 —— 它含绝对路径,可能含凭据

version: "1.0"

# ---------------------------------------------------------------
# Provider —— 模型从哪来
# 实际 provider 配置由 `goose configure` 写入 Goose 自己的配置目录,
# 这里记录下来是为了让实验可复现
# ---------------------------------------------------------------
# provider: ollama
# host: http://localhost:11434
# model: qwen3:14b          # ← 换成你实际用的

# ---------------------------------------------------------------
# Extensions —— 决定这个 agent 能做什么、不能做什么
#
# ⚠️ 权限边界靠这里控制,不靠提示词。
#    提示词是建议,extension 是物理隔离。
# ---------------------------------------------------------------
extensions:
  - type: stdio
    name: domain-docs
    # ⚠️ 必须绝对路径 —— stdio extension 是 spawn 的子进程,
    #    工作目录不一定是你想的那个
    cmd: node
    args:
      - /absolute/path/to/domain-mcp/dist/server.js
    # 检索 + 重排序可能慢,默认值容易误杀。稳定后再调紧
    timeout: 300
    description: "HVAC 技术文档检索"
    # ⚠️ 只暴露只读工具。写操作等检索跑稳了再放
    available_tools:
      - search_hvac_docs

  # --- 对照组:关掉 extension 跑一遍,确认模型不是在凭记忆编 ---
  # 把上面整块注释掉,重跑同一批题目。
  # 如果分数没怎么掉 → 说明它本来就没在用检索(环 1)

# ---------------------------------------------------------------
# 提示:限制最大轮次,避免环 6(循环不收敛)烧掉一个下午
# 具体键名以 `goose configure` 和 --help 为准,版本间有变化
# ---------------------------------------------------------------
